apiVersion: batch/v1
kind: CronJob
metadata:
  name: django-clearsessions
spec:
  schedule: "0 0 1 * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: django-clearsessions
              image: django_app:latest
              imagePullPolicy: Never
              command: ["./manage.py", "clearsessions"]
              env:
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: django-secret
                      key: SECRET_KEY

                - name: DEBUG
                  value: "False"

                - name: ALLOWED_HOSTS
                  value: "*"

                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: django-secret
                      key: DATABASE_URL