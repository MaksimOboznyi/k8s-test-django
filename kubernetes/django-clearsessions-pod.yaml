apiVersion: v1
kind: Pod
metadata:
  name: django-clearsessions
spec:
  restartPolicy: Never
  containers:
    - name: django-clearsessions
      image: django_app:latest
      imagePullPolicy: Never
      command: ["./manage.py", "clearsessions"]
      env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: SECRET_KEY

        - name: DEBUG
          value: "False"

        - name: ALLOWED_HOSTS
          value: "*"

        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: DATABASE_URL