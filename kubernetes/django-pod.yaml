apiVersion: v1
kind: Pod
metadata:
  name: django
  labels:
    app: django
spec:
  containers:
    - name: django
      image: django_app:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 80
      env:
        - name: SECRET_KEY
          value: dev-secret-key
        - name: DEBUG
          value: "False"
        - name: ALLOWED_HOSTS
          value: "*"
        - name: DATABASE_URL
          value: postgres://test_k8s:OwOtBep9Frut@host.minikube.internal:5432/test_k8s